name: Build Muse Number Two Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail

          project_dir="./dual-muse-apk"

          if [[ ! -f "$project_dir/gradlew" ]]; then
            echo "::error::Gradle wrapper not found in $project_dir"
            exit 1
          fi

          if [[ ! -f "$project_dir/settings.gradle" && ! -f "$project_dir/settings.gradle.kts" ]]; then
            echo "::error::Gradle settings file not found in $project_dir"
            exit 1
          fi

          echo "Android project: $project_dir"
          chmod +x "$project_dir/gradlew"

          cd "$project_dir"
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: muse-number-two-debug
          path: dual-muse-apk/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
